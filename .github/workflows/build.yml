
name: Build AXIOM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axiom-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build AXIOM (Minecraft 1.21.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
          cache-read-only: false

      - name: Locate AXIOM project
        shell: bash
        run: |
          if [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            echo "Project found in repository root."
          elif [ -f axiom-2.0.0-repaired-mixin-fix.zip ]; then
            mkdir -p axiom-source
            unzip -q axiom-2.0.0-repaired-mixin-fix.zip -d axiom-source
            echo "Project extracted."
            echo "PROJECT_DIR=$GITHUB_WORKSPACE/axiom-source" >> "$GITHUB_ENV"
          else
            echo "ERROR: Could not find AXIOM Gradle project or ZIP."
            exit 1
          fi

      - name: Build and test
        shell: bash
        run: |
          PROJECT_DIR="${PROJECT_DIR:-$GITHUB_WORKSPACE}"
          cd "$PROJECT_DIR"
          gradle --no-daemon build

      - name: Upload AXIOM JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AXIOM-JAR
          path: |
            **/build/libs/*.jar
            !**/*-sources.jar
          if-no-files-found: error
          retention-days: 14
